<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amberstone Meeting Room Booking</title>
<style>
:root{--green:#004531;--gold:#d4b56a;--bg:#f4f2ec;--card:#fff;--text:#1d2b25;--muted:#6b7a73;--line:#e2ded2;--busy:#e8f0ec;--busytext:#004531;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a15;--card:#18271f;--text:#ecefe9;--muted:#9fb0a7;--line:#2a3d33;--busy:#23483a;--busytext:#f0e2b8}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--green);display:flex;align-items:center;gap:16px;padding:6px 20px;border-bottom:3px solid var(--gold)}
header img{height:64px;display:block}
header h1{margin:0;font-size:18px;font-weight:600;color:#fff;letter-spacing:.5px}
header small{display:block;color:var(--gold);font-weight:400;font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 20px}
.bar button,.bar input{font:inherit}
.btn{background:var(--green);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
.btn.alt{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#1d2b25;font-weight:600}
.btn.danger{background:#b3261e}
.bar input[type=date]{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text)}
.date{font-weight:600;margin-left:6px}
.spacer{flex:1}
.wrap{padding:0 20px 24px;overflow-x:auto}
.grid{display:grid;grid-template-columns:64px repeat(3,minmax(170px,1fr));min-width:640px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.hd{padding:10px;font-weight:600;border-bottom:2px solid var(--gold);background:var(--card);position:sticky;top:0}
.hd small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.t{font-size:11px;color:var(--muted);padding:4px 6px;border-top:1px solid var(--line);height:28px}
.t.h{height:28px}
.col{position:relative;border-left:1px solid var(--line)}
.slot{height:28px;border-top:1px solid var(--line);cursor:pointer}
.slot:nth-child(odd){border-top-style:dashed}
.slot:hover{background:rgba(212,181,106,.25)}
.bk{position:absolute;left:3px;right:3px;background:var(--busy);color:var(--busytext);border-left:4px solid var(--gold);border-radius:6px;padding:4px 8px;font-size:12px;overflow:hidden;cursor:pointer;z-index:2}
.bk b{display:block;font-size:13px}
.now{position:absolute;left:0;right:0;height:2px;background:#d93025;z-index:3;pointer-events:none}
.legend{padding:0 20px 20px;color:var(--muted);font-size:12px}
dialog{border:0;border-radius:14px;padding:0;width:min(440px,94vw);background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.5)}
form{padding:20px;display:grid;gap:10px}
form h2{margin:0 0 4px;font-size:18px;color:var(--green)}
@media (prefers-color-scheme:dark){form h2{color:var(--gold)}}
label{font-size:12px;color:var(--muted);display:grid;gap:3px}
form input,form select,form textarea{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:#b3261e;font-size:13px;min-height:16px}
.warn{color:#9a6b00;font-size:13px}
.acts{display:flex;gap:8px;justify-content:flex-end}
.tv{font-size:1.25em}
body{background:radial-gradient(circle at top right,rgba(212,181,106,.2),transparent 45%),var(--bg);min-height:100vh}
header{background:linear-gradient(120deg,#003325,var(--green) 55%,#0a5a41);box-shadow:0 4px 18px rgba(0,69,49,.35);padding:8px 28px}
header img{height:72px}
header h1{font-size:22px;letter-spacing:1px}
header h1 small{letter-spacing:3px;text-transform:uppercase;font-size:11px;margin-top:2px}
.clock{text-align:right;color:#fff}
.clock b{display:block;font-size:30px;font-weight:600;letter-spacing:1px;color:var(--gold)}
.clock span{font-size:12px;opacity:.85}
.btn{border-radius:999px;padding:9px 18px;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,0,0,.18)}
.btn.gold{box-shadow:0 3px 10px rgba(212,181,106,.5)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;padding:4px 20px 14px}
.sc{background:var(--card);border-radius:14px;padding:14px 18px;border:1px solid var(--line);border-top:3px solid var(--gold);box-shadow:0 4px 14px rgba(0,0,0,.06);display:grid;gap:2px;min-width:0}
.sc span{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.sc b{font-size:22px;color:var(--green);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc em{font-style:normal;font-size:12px;color:var(--muted);min-height:15px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sc b{color:var(--gold)}}
.grid{border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.09)}
.hd{padding:14px 12px;border-bottom:3px solid var(--rc,var(--gold))}
.hd .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.bd{display:inline-block;font-style:normal;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;margin-top:6px;background:var(--line);color:var(--muted)}
.bd.free{background:rgba(31,122,92,.18);color:#1f7a5c}
.bd.busy{background:rgba(179,38,30,.15);color:#c0392b}
.slot:nth-child(4n+1),.slot:nth-child(4n+2){background:rgba(0,69,49,.035)}
.slot:hover{background:rgba(212,181,106,.3)}
.bk{background:linear-gradient(135deg,color-mix(in srgb,var(--rc,#1f7a5c) 22%,var(--card)),color-mix(in srgb,var(--rc,#1f7a5c) 8%,var(--card)));border-left:4px solid var(--rc,#d4b56a);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.14);border-radius:8px}
.bk:hover{filter:brightness(.97)}
.now{box-shadow:0 0 6px rgba(217,48,37,.6)}
dialog{box-shadow:0 24px 70px rgba(0,0,0,.4)}
form h2{border-bottom:2px solid var(--gold);padding-bottom:10px}
.legend{text-align:center}
</style>
</head>

  <h1>Meeting Room Booking<small>Front Desk</small></h1>
  <span class="spacer"></span>
  <div class="clock"><b id="clk"></b><span id="cdt"></span></div>
</header>

<div class="bar">
  <button class="btn alt" id="prev">&#8249;</button>
  <button class="btn alt" id="today">Today</button>
  <button class="btn alt" id="next">&#8250;</button>
  <input type="date" id="dp">
  <span class="date" id="dl"></span>
  <span class="spacer"></span>
  <span class="warn" id="fs"></span>
  <button class="btn alt" id="tv">TV view</button>
  <button class="btn gold" id="new">+ New booking</button>
</div>

<div class="stats" id="stats"></div>
<div class="wrap"><div class="grid" id="grid"></div></div>
<div class="legend">Click an empty slot to book. Click a booking to edit or cancel. Red line = current time.</div>

<dialog id="dlg">
  <form id="f" method="dialog" onsubmit="return false">
    <h2 id="ft">New booking</h2>
    <label>Room<select id="room"></select></label>
    <label>Date<input type="date" id="date" required></label>
    <div class="two">
      <label>Start<select id="st"></select></label>
      <label>End<select id="en"></select></label>
    </div>
    <label>Meeting title<input id="title" required placeholder="e.g. Sales review"></label>
    <div class="two">
      <label>Booked for (host / dept)<input id="host" required></label>
      <label>Attendees<input type="number" id="pax" min="1" value="2" required></label>
    </div>
    <label>Visitor name / company (optional)<input id="vis"></label>
    <label>Notes (tea, projector, video call)<textarea id="notes" rows="2"></textarea></label>
    <div class="warn" id="warn"></div>
    <div class="err" id="err"></div>
    <div class="acts">
      <button type="button" class="btn danger" id="del" hidden>Cancel booking</button>
      <button type="button" class="btn alt" id="close">Close</button>
      <button type="button" class="btn" id="save">Save</button>
    </div>
  </form>
</dialog>

<script>
// ---- EDIT HERE: room names, capacity, working hours ----
const ROOMS=[
  {id:'boardroom',name:'Boardroom',cap:12,color:'#b8923a'},
  {id:'room6',name:'6 Pax Room',cap:6,color:'#1f7a5c'},
  {id:'room4',name:'4 Pax Room',cap:4,color:'#3b7ea1'}
];
const START=9,END=19,STEP=30; // 9 AM to 7 PM, 30-min slots
// --------------------------------------------------------
const KEY='amberstone-bookings';
const $=id=>document.getElementById(id);
let bookings=[];
try{bookings=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){bookings=[]}
const persist=()=>{};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const mins=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const hm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const lbl=m=>{const h=Math.floor(m/60),mm=m%60,ap=h>=12?'PM':'AM';return((h+11)%12+1)+':'+pad(mm)+' '+ap};
let cur=new Date();let editId=null;
const SH=28,PER=STEP;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rstat(r){
  const now=new Date(),nm=now.getHours()*60+now.getMinutes();
  const l=bookings.filter(b=>b.room===r.id&&b.date===ymd(cur));
  if(ymd(cur)!==ymd(now))return `<i class="bd">${l.length} booking${l.length==1?'':'s'}</i>`;
  const c=l.find(b=>mins(b.start)<=nm&&nm<mins(b.end));
  return c?`<i class="bd busy">In use until ${lbl(mins(c.end))}</i>`:`<i class="bd free">Available now</i>`;
}
function dash(){
  const now=new Date(),td=ymd(now),nm=now.getHours()*60+now.getMinutes();
  $('clk').textContent=now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
  $('cdt').textContent=now.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'short'});
  const today=bookings.filter(b=>b.date===td);
  const busy=ROOMS.filter(r=>today.some(b=>b.room===r.id&&mins(b.start)<=nm&&nm<mins(b.end)));
  const nxt=today.filter(b=>mins(b.start)>nm).sort((a,b)=>mins(a.start)-mins(b.start))[0];
  const rn=id=>(ROOMS.find(r=>r.id===id)||{name:id}).name;
  const card=(a,b,c)=>`<div class="sc"><span>${a}</span><b>${esc(b)}</b><em>${esc(c)}</em></div>`;
  $('stats').innerHTML=card('Rooms free now',(ROOMS.length-busy.length)+' of '+ROOMS.length,'')+card('Meetings today',today.length,'')+card('Next up',nxt?nxt.title:'Nothing scheduled',nxt?lbl(mins(nxt.start))+' | '+rn(nxt.room):'');
}
setInterval(dash,30000);

function render(){
  const d=ymd(cur);$('dp').value=d;dash();
  $('dl').textContent=cur.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const g=$('grid');g.innerHTML='';
  g.appendChild(Object.assign(document.createElement('div'),{className:'hd',innerHTML:'&nbsp;'}));
  ROOMS.forEach(r=>{const h=Object.assign(document.createElement('div'),{className:'hd',innerHTML:`<span class="dot" style="background:${r.color}"></span>${r.name}<small>Seats up to ${r.cap}</small>${rstat(r)}`});h.style.setProperty('--rc',r.color);g.appendChild(h)});
  const n=(END-START)*60/STEP;
  const tc=document.createElement('div');
  for(let i=0;i<n;i++){const t=document.createElement('div');t.className='t';t.textContent=i%2==0?lbl(START*60+i*STEP):'';tc.appendChild(t)}
  g.appendChild(tc);
  ROOMS.forEach(r=>{
    const c=document.createElement('div');c.className='col';
    for(let i=0;i<n;i++){const s=document.createElement('div');s.className='slot';const m=START*60+i*STEP;s.onclick=()=>openDlg(null,r.id,d,m);c.appendChild(s)}
    bookings.filter(b=>b.room===r.id&&b.date===d).forEach(b=>{
      const top=(mins(b.start)-START*60)/PER*SH,h=(mins(b.end)-mins(b.start))/PER*SH;
      const e=document.createElement('div');e.className='bk';e.style.top=top+'px';e.style.height=(h-2)+'px';e.style.setProperty('--rc',r.color);
      e.innerHTML='<b></b><span></span>';e.firstChild.textContent=b.title;
      e.lastChild.textContent=lbl(mins(b.start))+' - '+lbl(mins(b.end))+(b.host?' | '+b.host:'')+(b.vis?' | Visitor: '+b.vis:'');
      e.onclick=ev=>{ev.stopPropagation();openDlg(b)};c.appendChild(e)});
    if(d===ymd(new Date())){const nm=new Date();const m=nm.getHours()*60+nm.getMinutes();
      if(m>=START*60&&m<END*60){const l=document.createElement('div');l.className='now';l.style.top=((m-START*60)/PER*SH)+'px';c.appendChild(l)}}
    g.appendChild(c)});
}
function fillTimes(){
  const a=[],b=[];
  for(let m=START*60;m<END*60;m+=STEP)a.push(m);
  for(let m=START*60+STEP;m<=END*60;m+=STEP)b.push(m);
  $('st').innerHTML=a.map(m=>'<option value="'+hm(m)+'">'+lbl(m)+'</option>').join('');
  $('en').innerHTML=b.map(m=>'<option value="'+hm(m)+'">'+lbl(m)+'</option>').join('');
  $('room').innerHTML=ROOMS.map(r=>'<option value="'+r.id+'">'+r.name+'</option>').join('');
}
function openDlg(b,room,date,m){
  editId=b?b.id:null;$('err').textContent='';$('warn').textContent='';
  $('ft').textContent=b?'Edit booking':'New booking';$('del').hidden=!b;
  $('room').value=b?b.room:(room||ROOMS[0].id);
  $('date').value=b?b.date:(date||ymd(cur));
  const s=b?mins(b.start):(m??10*60);
  $('st').value=hm(s);$('en').value=b?b.end:hm(Math.min(s+60,END*60));
  $('title').value=b?b.title:'';$('host').value=b?b.host:'';$('pax').value=b?b.pax:2;
  $('vis').value=b?b.vis:'';$('notes').value=b?b.notes:'';
  chkCap();$('dlg').showModal();
}
function chkCap(){const r=ROOMS.find(x=>x.id===$('room').value);
  $('warn').textContent=(+$('pax').value>r.cap)?'Attendees exceed room capacity ('+r.cap+'). Consider a bigger room.':''}
async function save(){
  const b={id:editId||crypto.randomUUID(),room:$('room').value,date:$('date').value,start:$('st').value,end:$('en').value,
    title:$('title').value.trim(),host:$('host').value.trim(),pax:+$('pax').value,vis:$('vis').value.trim(),notes:$('notes').value.trim()};
  if(!b.title||!b.host||!b.date){$('err').textContent='Please fill title, host and date.';return}
  if(mins(b.end)<=mins(b.start)){$('err').textContent='End time must be after start time.';return}
  const clash=bookings.find(x=>x.id!==b.id&&x.room===b.room&&x.date===b.date&&mins(b.start)<mins(x.end)&&mins(b.end)>mins(x.start));
  if(clash){$('err').textContent='Clash with "'+clash.title+'" ('+lbl(mins(clash.start))+' - '+lbl(mins(clash.end))+').';return}
  try{await dbSave(b)}catch(e){$('err').textContent=e.message;await load();return}
  $('dlg').close();cur=new Date(b.date+'T00:00');await load();
}
$('save').onclick=save;
$('close').onclick=()=>$('dlg').close();
$('del').onclick=async()=>{if(confirm('Cancel this booking?')){try{await dbDel(editId)}catch(e){$('err').textContent=e.message;return}$('dlg').close();await load()}};

  const r=await fetch(SB_URL+path,{...opts,headers:{apikey:SB_KEY,...(session?{Authorization:'Bearer '+session.access_token}:{}),'Content-Type':'application/json',...(opts.headers||{})}});

  if(!r.ok){throw new Error(r.status==409?'Clash: that slot was just booked by someone else.':((j&&j.message)||'Error '+r.status))}
  return j;
}
async function refresh(){

}

}
